server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot Web 产物较大，务必开启压缩
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/wasm application/octet-stream image/svg+xml;

    # 关键：wasm 必须是 application/wasm，否则部分浏览器会拒绝流式编译
    types {
        application/wasm                 wasm;
        application/octet-stream         pck;
        text/javascript                  js;
    }

    # 带 hash 的产物可以长缓存；index.html 不缓存
    location ~* \.(wasm|pck|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 单页应用：找不到文件回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 若将来开启 Godot 的线程支持（variant/thread_support=true），
    # 必须取消下面两行注释，否则 SharedArrayBuffer 不可用：
    # add_header Cross-Origin-Opener-Policy "same-origin";
    # add_header Cross-Origin-Embedder-Policy "require-corp";
}
